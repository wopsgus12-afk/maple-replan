name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Build Windows installer
        run: npm run electron:build

      - name: Publish Windows asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 2>/dev/null || gh release create v0.1.0 --title "v0.1.0" --notes "메이플 재획 정산 Windows 설치 프로그램"
          cp dist-electron/*Setup*.exe maple-replan-setup-0.1.0.exe
          gh release upload v0.1.0 maple-replan-setup-0.1.0.exe --clobber

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true
          single-commit: true
