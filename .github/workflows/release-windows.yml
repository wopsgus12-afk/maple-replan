name: Release Windows installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-win:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run electron:build

      - name: Publish Windows asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 2>/dev/null || gh release create v0.1.0 --title "v0.1.0" --notes "메이플 재획 정산 Windows 설치 프로그램"
          cp dist-electron/*Setup*.exe maple-replan-setup-0.1.0.exe
          gh release upload v0.1.0 maple-replan-setup-0.1.0.exe --clobber
